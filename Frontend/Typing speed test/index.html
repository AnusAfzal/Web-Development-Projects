<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Typing Speed Test</title>
</head>

<body>

    <div class="time">
        <p id="time-p">Time: 00 sec</p>
    </div>

    <div class="passage-div">
        <p id="passage"> </p>
    </div>

    <div class="input-area">
        <input type="text" placeholder="Write passage here!">
    </div>

    <div class="result-area">
        <div class="wpm">
            <p class="WPM"></p>
        </div>
        <div class="accuracy">
            <p class="ACC"></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
